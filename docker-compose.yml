services:
  app:
    image: ghcr.io/xinhai-ai/precheck:latest
    container_name: precheck-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4060:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
  db-init:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - -c
      - |
        psql $$DATABASE_URL \
          -f /scripts/001-create-auth-tables.sql \
          -f /scripts/002-init-system-config.sql \
          -f /scripts/003-promote-super-admin.sql
    profiles:
      - init

